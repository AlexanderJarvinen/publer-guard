name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests eval mutation_check.py

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest -q

      # The eval harness runs the full pipeline against 6 known CSV cases
      # using FakeLLMClient — deterministic, no API key, no cost.
      - name: Run eval harness
        run: python -m eval.runner
