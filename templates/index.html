<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>publer-guard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --text:     #e0e0e0;
      --muted:    #666;
      --accent:   #c47a00;
      --accent-h: #e08f00;
      --green:    #2a7a3b;
      --green-t:  #4ade7b;
      --red:      #7a2a2a;
      --red-t:    #f87171;
      --yellow:   #6b5a00;
      --yellow-t: #fbbf24;
      --radius:   8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

    /* ── Header ── */
    header { margin-bottom: 36px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 4px; font-size: 13px; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase;
               letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px; }

    /* ── Bulk drop zone ── */
    .bulk-drop {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .bulk-drop:hover { border-color: var(--accent); color: var(--text); }
    .bulk-drop.dragover { border-color: var(--accent); color: var(--text); background: #1f1500; }
    .bulk-drop b { color: var(--text); font-weight: 600; }

    /* ── Form ── */
    .file-row {
      display: grid;
      grid-template-columns: 1fr 200px 36px;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    @media (max-width: 600px) { .file-row { grid-template-columns: 1fr; } }
    .file-row .col-label { display: block; }
    /* Hide the duplicated "CSV file"/"Platform" captions on rows past the first */
    .file-row:not(:first-child) label { visibility: hidden; height: 0; margin: 0; }
    @media (max-width: 600px) {
      .file-row:not(:first-child) label { visibility: visible; height: auto; margin-bottom: 6px; }
    }

    label { display: block; font-size: 12px; color: var(--muted);
            margin-bottom: 6px; font-weight: 500; }

    .file-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color .15s;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .file-wrap:hover { border-color: var(--accent); }
    .file-wrap.has-file { color: var(--text); border-color: #444; }
    #file-input { display: none; }

    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: 13px;
      appearance: none;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }

    /* remove-row button (×) */
    .fr-remove {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: var(--radius);
      width: 36px; height: 42px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .fr-remove:hover { border-color: var(--red-t); color: var(--red-t); background: transparent; }
    @media (max-width: 600px) { .fr-remove { width: 100%; } }

    /* + Add file button (secondary style) */
    .btn-add {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: var(--radius);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
    .btn-add svg { width: 14px; height: 14px; }

    .btn-row { margin-top: 20px; display: flex; gap: 10px; align-items: center; }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: var(--accent-h); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }
    .stat .num { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px;
                 text-transform: uppercase; letter-spacing: .06em; }
    .stat.green .num { color: var(--green-t); }
    .stat.red   .num { color: var(--red-t); }
    .stat.yellow .num { color: var(--yellow-t); }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .badge.fixed    { background: var(--green); color: var(--green-t); }
    .badge.escalated{ background: var(--yellow); color: var(--yellow-t); }
    .badge.unfixed  { background: var(--red); color: var(--red-t); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 12px; border-bottom: 1px solid #1f1f1f; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1f1f1f; }

    .rule-id { font-family: monospace; font-size: 12px; color: var(--accent); }
    .row-idx { color: var(--muted); font-size: 12px; }
    .msg { color: #bbb; line-height: 1.4; }
    .proposed { color: #888; font-size: 12px; font-style: italic; max-width: 280px;
                white-space: pre-wrap; word-break: break-word; }

    /* ── Post-fix lint ── */
    .lint-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: var(--green-t); }
    .dot.red   { background: var(--red-t); }

    /* ── Download ── */
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: var(--radius);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s;
    }
    .dl-btn:hover { background: #1f1500; }

    /* ── Error ── */
    .error-box {
      background: var(--red);
      border: 1px solid #a03030;
      border-radius: var(--radius);
      padding: 14px 18px;
      color: var(--red-t);
      font-size: 13px;
    }

    /* ── Hidden ── */
    .hidden { display: none !important; }

    .rate-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>publer<span>-guard</span></h1>
    <p>Validate and auto-repair Publer bulk-upload CSVs before publishing</p>
  </header>

  <!-- ── Upload form ── -->
  <div class="card">
    <h2>Input</h2>

    <!-- Bulk upload: one dialog, many CSVs at once → each becomes a row below -->
    <div class="bulk-drop" id="bulk-drop" onclick="document.getElementById('bulk-input').click()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span><b>Upload CSV files</b> — select several at once, or drop them here</span>
    </div>
    <input type="file" id="bulk-input" accept=".csv,text/csv" multiple style="display:none">

    <!-- Dynamic file+platform rows are injected here -->
    <div id="file-rows"></div>

    <button type="button" class="btn-add" id="add-row-btn" onclick="addRow()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add file manually
    </button>

    <div class="btn-row">
      <button id="run-btn" onclick="runPipeline()">Validate</button>
      <div class="spinner" id="spinner"></div>
      <span id="run-status" style="color:var(--muted);font-size:13px;"></span>
    </div>
  </div>

  <!-- ── Error ── -->
  <div class="error-box hidden" id="error-box"></div>

  <!-- ── Results ── -->
  <div id="results" class="hidden">

    <!-- Summary -->
    <div class="summary-grid" id="summary-grid"></div>

    <!-- Violations table -->
    <div class="card" id="violations-card">
      <h2>Violations</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>File</th>
              <th>Rule</th>
              <th>Row</th>
              <th>Message</th>
              <th>Status</th>
              <th>Reason / fix</th>
            </tr>
          </thead>
          <tbody id="violations-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Post-fix lint -->
    <div class="card" id="lint-card">
      <h2>Post-fix re-lint</h2>
      <div class="lint-status" id="lint-status"></div>
    </div>

    <!-- Monitoring -->
    <div class="card" id="monitoring-card">
      <h2>LLM calls</h2>
      <div id="monitoring-body"></div>
    </div>

    <!-- Download -->
    <div class="card">
      <h2>Output</h2>
      <div id="dl-links" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;"></div>

      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
                  display:flex;gap:10px;flex-wrap:wrap;">
        <button type="button" class="dl-btn" onclick="downloadReportJson()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          Download report (JSON)
        </button>
        <button type="button" class="dl-btn" onclick="downloadReportCsv()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
          </svg>
          Download report (CSV)
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Platforms (from server) ──────────────────────────────────────────────────
  const PLATFORMS = {{ platforms | tojson }};

  // ── CSV validation ────────────────────────────────────────────────────────────
  // Extension is the reliable signal; browsers report inconsistent MIME types.
  function isCsv(file) {
    return /\.csv$/i.test(file.name);
  }

  // Assign a File object to a row's hidden <input type=file> (for bulk/drop).
  function setRowFile(row, file) {
    const input = row.querySelector('.fr-input');
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    row.querySelector('.fr-name').textContent = file.name;
    row.querySelector('.fr-wrap').classList.add('has-file');
  }

  // ── Dynamic file+platform rows ────────────────────────────────────────────────
  function addRow(file) {
    const rows = document.getElementById('file-rows');
    const row = document.createElement('div');
    row.className = 'file-row';

    const options = ['<option value="" selected disabled>— select —</option>']
      .concat(PLATFORMS.map(p => `<option value="${p}">${p}</option>`))
      .join('');

    row.innerHTML = `
      <div class="fr-file">
        <label>CSV file</label>
        <div class="file-wrap fr-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="fr-name">Choose file…</span>
        </div>
        <input type="file" class="fr-input" accept=".csv" style="display:none">
      </div>
      <div class="fr-platform">
        <label>Platform</label>
        <select class="fr-select">${options}</select>
      </div>
      <button type="button" class="fr-remove" title="Remove this file">&times;</button>
    `;
    rows.appendChild(row);

    // Wire the picker
    const wrap = row.querySelector('.fr-wrap');
    const input = row.querySelector('.fr-input');
    const name = row.querySelector('.fr-name');
    wrap.addEventListener('click', () => input.click());
    input.addEventListener('change', function () {
      if (this.files.length) {
        if (!isCsv(this.files[0])) {
          alert('"' + this.files[0].name + '" is not a .csv file');
          this.value = '';
          name.textContent = 'Choose file…';
          wrap.classList.remove('has-file');
          return;
        }
        name.textContent = this.files[0].name;
        wrap.classList.add('has-file');
      } else {
        name.textContent = 'Choose file…';
        wrap.classList.remove('has-file');
      }
    });

    // Wire remove
    row.querySelector('.fr-remove').addEventListener('click', () => removeRow(row));
    updateRemoveButtons();

    // Pre-fill with a File (bulk upload / drag-drop).
    if (file) setRowFile(row, file);
    return row;
  }

  // ── Bulk upload → one row per selected CSV ────────────────────────────────────
  function handleBulkFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    const valid = files.filter(isCsv);
    const invalid = files.filter(f => !isCsv(f));
    if (invalid.length) {
      alert('Skipped — not .csv files:\n' + invalid.map(f => f.name).join('\n'));
    }
    if (!valid.length) return;

    // If the only row is an empty starter row, reuse it instead of leaving a blank.
    const existing = document.querySelectorAll('.file-row');
    if (existing.length === 1 && !existing[0].querySelector('.fr-input').files.length) {
      setRowFile(existing[0], valid.shift());
    }
    valid.forEach(f => addRow(f));
  }

  function removeRow(row) {
    row.remove();
    updateRemoveButtons();
  }

  // Keep at least one row; disable the × when only one remains.
  function updateRemoveButtons() {
    const rows = document.querySelectorAll('.file-row');
    rows.forEach(r => {
      const btn = r.querySelector('.fr-remove');
      btn.disabled = rows.length <= 1;
      btn.style.opacity = rows.length <= 1 ? '0.3' : '1';
      btn.style.cursor = rows.length <= 1 ? 'not-allowed' : 'pointer';
    });
  }

  // Start with one row.
  addRow();

  // Wire the bulk file input (multiple selection in one dialog).
  document.getElementById('bulk-input').addEventListener('change', function () {
    handleBulkFiles(this.files);
    this.value = '';   // allow re-selecting the same files later
  });

  // Drag & drop onto the bulk zone.
  const bulkDrop = document.getElementById('bulk-drop');
  ['dragenter', 'dragover'].forEach(ev =>
    bulkDrop.addEventListener(ev, e => { e.preventDefault(); bulkDrop.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(ev =>
    bulkDrop.addEventListener(ev, e => { e.preventDefault(); bulkDrop.classList.remove('dragover'); }));
  bulkDrop.addEventListener('drop', e => {
    if (e.dataTransfer && e.dataTransfer.files) handleBulkFiles(e.dataTransfer.files);
  });

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function el(id) { return document.getElementById(id); }
  function show(id) { el(id).classList.remove('hidden'); }
  function hide(id) { el(id).classList.add('hidden'); }

  function badge(outcome) {
    const map = { fixed: 'Fixed', escalated: 'Escalated', unfixed: 'Unfixed' };
    return `<span class="badge ${outcome}">${map[outcome] || outcome}</span>`;
  }

  // Build a map: "file:rule_id:row_index" → last attempt
  function finalAttempts(attempts) {
    const map = {};
    for (const a of attempts) map[`${a.file || ''}:${a.rule_id}:${a.row_index}`] = a;
    return map;
  }

  // ── Main pipeline call ───────────────────────────────────────────────────────
  async function runPipeline() {
    const rows = Array.from(document.querySelectorAll('.file-row'));

    // Collect and validate every row.
    const picked = [];
    for (const r of rows) {
      const input = r.querySelector('.fr-input');
      const platform = r.querySelector('.fr-select').value;
      if (!input.files.length) continue;      // skip empty rows silently
      if (!platform) {
        alert('Please select a platform for ' + input.files[0].name);
        return;
      }
      picked.push({ file: input.files[0], platform });
    }

    if (!picked.length) {
      alert('Please select at least one CSV file');
      return;
    }

    // UI: loading state
    el('run-btn').disabled = true;
    el('spinner').classList.add('active');
    el('run-status').textContent =
      picked.length > 1 ? `Running pipeline on ${picked.length} files…` : 'Running pipeline…';
    hide('results');
    hide('error-box');

    const form = new FormData();
    for (const p of picked) {
      form.append('files', p.file);
      form.append('platforms', p.platform);
    }

    try {
      const resp = await fetch('/run', { method: 'POST', body: form });
      const data = await resp.json();

      if (!resp.ok || data.error) {
        el('error-box').textContent = data.error || 'Unknown error';
        show('error-box');
        return;
      }

      renderResults(data);
      show('results');
    } catch (err) {
      el('error-box').textContent = 'Network error: ' + err.message;
      show('error-box');
    } finally {
      el('run-btn').disabled = false;
      el('spinner').classList.remove('active');
      el('run-status').textContent = '';
    }
  }

  // Last merged report — kept so the download buttons can serialize it.
  let lastResult = null;

  // ── Render results ───────────────────────────────────────────────────────────
  function renderResults(data) {
    lastResult = data;
    const s = data.summary;
    const final = finalAttempts(data.attempts || []);

    // Summary cards
    el('summary-grid').innerHTML = `
      <div class="stat"><div class="num">${s.total_violations}</div><div class="lbl">Violations</div></div>
      <div class="stat green"><div class="num">${s.fixed}</div><div class="lbl">Fixed</div></div>
      <div class="stat yellow"><div class="num">${s.escalated_to_human}</div><div class="lbl">Escalated</div></div>
      <div class="stat ${s.unfixed_after_retries > 0 ? 'red' : ''}">
        <div class="num">${s.unfixed_after_retries}</div><div class="lbl">Unfixed</div>
      </div>
      <div class="stat"><div class="num">${Math.round(s.first_attempt_fix_rate * 100)}%</div>
        <div class="lbl">1st-attempt rate</div></div>
    `;

    // Violations table
    if (!data.violations || data.violations.length === 0) {
      el('violations-card').innerHTML = '<h2>Violations</h2><p style="color:var(--muted);font-size:13px">No violations found — CSV is clean ✓</p>';
    } else {
      const rows = data.violations.map(v => {
        const key = `${v.file || ''}:${v.rule_id}:${v.row_index}`;
        const attempt = final[key];
        const outcome = attempt ? attempt.outcome : '—';

        // Last column: for escalated show gate_rejection reason; for others show proposed text
        let detail = '—';
        if (attempt && attempt.outcome === 'escalated' && attempt.gate_rejection) {
          detail = `<span style="color:var(--yellow-t);font-size:12px">${escHtml(attempt.gate_rejection)}</span>`;
        } else if (attempt && attempt.proposed_text) {
          const t = attempt.proposed_text;
          detail = `<span class="proposed">${escHtml(t.length > 120 ? t.substring(0, 120) + '…' : t)}</span>`;
        }

        return `<tr>
          <td><span class="row-idx">${escHtml(v.file || '—')}</span></td>
          <td><span class="rule-id">${v.rule_id}</span></td>
          <td><span class="row-idx">row ${v.row_index}</span></td>
          <td><span class="msg">${escHtml(v.message)}</span></td>
          <td>${badge(outcome)}</td>
          <td>${detail}</td>
        </tr>`;
      }).join('');
      el('violations-body').innerHTML = rows;
    }

    // Post-fix lint
    const pfl = data.post_fix_lint;
    if (pfl.clean) {
      el('lint-status').innerHTML =
        '<div class="dot green"></div><span>Clean — no new violations introduced by fixes</span>';
    } else if (pfl.introduced_by_fix && pfl.introduced_by_fix.length) {
      const list = pfl.introduced_by_fix.map(v => `<code>${v.rule_id}</code>`).join(', ');
      el('lint-status').innerHTML =
        `<div class="dot red"></div><span>Fixes introduced new violations: ${list}. Check report.json.</span>`;
    } else {
      el('lint-status').innerHTML =
        `<div class="dot red" style="background:var(--yellow-t)"></div>
         <span>${pfl.residual_known} known violation(s) remain (escalated / unfixed)</span>`;
    }

    // Monitoring
    const mon = data.monitoring;
    const estimated = mon.tokens_estimated ? ' <span style="color:var(--muted)">(estimated)</span>' : '';
    const byModel = Object.entries(mon.by_model || {}).map(([model, m]) =>
      `<tr>
        <td style="font-family:monospace;font-size:12px;color:var(--accent)">${model}</td>
        <td>${m.calls}</td>
        <td>${m.input_tokens} / ${m.output_tokens}</td>
        <td>$${m.est_cost_usd.toFixed(5)}</td>
      </tr>`
    ).join('');
    el('monitoring-body').innerHTML = `
      <div style="display:flex;gap:24px;margin-bottom:14px;font-size:13px">
        <span>Calls: <b>${mon.total_calls}</b></span>
        <span>Tokens in/out: <b>${mon.total_input_tokens} / ${mon.total_output_tokens}</b>${estimated}</span>
        <span>Est. cost: <b>$${mon.est_cost_usd.toFixed(5)}</b></span>
      </div>
      ${byModel ? `<div class="table-wrap"><table>
        <thead><tr><th>Model</th><th>Calls</th><th>Tokens in/out</th><th>Est. cost</th></tr></thead>
        <tbody>${byModel}</tbody>
      </table></div>` : ''}
    `;

    // Download links — one per processed file
    const dlIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/></svg>`;
    const outFiles = data.files || (data.fixed_csv ? [{ fixed_csv: data.fixed_csv, filename: data.fixed_csv, platform: '' }] : []);
    el('dl-links').innerHTML = outFiles.map(f => `
      <a class="dl-btn" href="/download/${encodeURIComponent(f.fixed_csv)}">
        ${dlIcon}
        ${escHtml(f.filename)}${f.platform ? ` <span style="color:var(--muted);font-weight:400">· ${escHtml(f.platform)}</span>` : ''}
      </a>`).join('');
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Report downloads ──────────────────────────────────────────────────────────
  function stamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  function triggerDownload(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function downloadReportJson() {
    if (!lastResult) { alert('Run a validation first'); return; }
    triggerDownload(
      JSON.stringify(lastResult, null, 2),
      `publer-guard_report_${stamp()}.json`,
      'application/json'
    );
  }

  // One row per violation, matching the on-screen table (File, Rule, Row, Message, Status, Detail).
  function downloadReportCsv() {
    if (!lastResult) { alert('Run a validation first'); return; }
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

    const final = finalAttempts(lastResult.attempts || []);
    const header = ['File', 'Rule', 'Row', 'Message', 'Status', 'Detail'];
    const lines = [header.map(q).join(',')];

    for (const v of (lastResult.violations || [])) {
      const attempt = final[`${v.file || ''}:${v.rule_id}:${v.row_index}`];
      const status = attempt ? attempt.outcome : '';
      let detail = '';
      if (attempt && attempt.outcome === 'escalated' && attempt.gate_rejection) {
        detail = attempt.gate_rejection;
      } else if (attempt && attempt.proposed_text) {
        detail = attempt.proposed_text;
      }
      lines.push([v.file, v.rule_id, v.row_index, v.message, status, detail].map(q).join(','));
    }

    // Prepend a small summary block for context.
    const s = lastResult.summary || {};
    const summary = [
      ['# publer-guard report'],
      ['# violations', s.total_violations],
      ['# fixed', s.fixed],
      ['# escalated', s.escalated_to_human],
      ['# unfixed', s.unfixed_after_retries],
      ['# first-attempt fix rate', Math.round((s.first_attempt_fix_rate || 0) * 100) + '%'],
      [''],
    ].map(r => r.map(q).join(',')).join('\r\n');

    // BOM so Excel opens UTF-8 (Cyrillic) correctly.
    triggerDownload('﻿' + summary + '\r\n' + lines.join('\r\n'),
      `publer-guard_report_${stamp()}.csv`, 'text/csv');
  }
</script>
</body>
</html>
